name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-and-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed env files, keys or certificates
        run: |
          set -e
          # .env.example is allowed (it documents required vars without secrets)
          bad=$(git ls-files | grep -E '(^|/)\.env(\..*)?$|\.p8$|\.p12$|\.mobileprovision$|\.keystore$|\.jks$' | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files committed:"; echo "$bad"; exit 1; fi
      - name: Required docs exist
        run: |
          for f in CLAUDE.md docs/PROGRESS.md docs/DECISIONS.md docs/architecture.md docs/data-model.md docs/security.md docs/privacy.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

# web and supabase jobs commented out until apps/web/package.json and supabase/config.toml exist.
# hashFiles() at job-level `if:` fails before checkout runs; will re-enable when code is added.

# iOS builds run on James's Mac (macOS runners cost 10x minutes); Claude Code attaches build output to the PR.
